/* ================= 大盘量能 ================= */
const IDX_CODES = ['sh000001', 'sz399106', 'sz399001', 'sz399006'];
const IDX_SH = 'sh000001', IDX_SZ = 'sz399106';
const fmtBig = v => { if(!isFinite(v) || v <= 0) return '--';
  return v >= 1e12 ? (v/1e12).toFixed(2)+'万亿' : v >= 1e8 ? Math.round(v/1e8)+'亿' : Math.round(v/1e4)+'万'; };
const dateStr = d => { const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };

function mktPhase(){
  const d = new Date(), day = d.getDay(), m = d.getHours()*60 + d.getMinutes();
  if(day === 0 || day === 6) return 'closed';
  if(m < 555) return 'pre';
  if(m < 570) return 'auction';
  if(m <= 900) return 'open';
  return 'after';
}

async function fetchIdxDailyRaw(code){
  const varName = '__mk_' + Math.random().toString(36).slice(2);
  try{
    await loadScript('https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?_var=' + varName +
      '&param=' + code + ',day,,,4,qfq&r=' + Math.random(), null, 8000);
    const node = window[varName] && window[varName].data && window[varName].data[code];
    const arr = (node && (node.day || node.qfqday)) || [];
    const rows = [];
    for(const r of arr){
      if(!Array.isArray(r) || r.length < 6) continue;
      rows.push({ date: String(r[0]), vol: +r[5] });
    }
    return rows.length ? rows : null;
  }catch(e){ return null; }
  finally{ try{ delete window[varName]; }catch(e){} }
}

async function loadIdxDaily(force){
  const m = state.mkt;
  if(!force && m.daily && Date.now() - m.dailyAt < 1800000) return m.daily;
  const [sh, sz] = await Promise.all([fetchIdxDailyRaw(IDX_SH), fetchIdxDailyRaw(IDX_SZ)]);
  if(sh || sz){
    m.daily = m.daily || {};
    if(sh) m.daily.sh = sh;
    if(sz) m.daily.sz = sz;
    m.dailyAt = Date.now();
  }
  return m.daily;
}

/* 每日总成交额本地存档：盘后/休市记录已完结的全天金额，供“近N日”回看 */
const MK_LS = 'astock.mkhist.v1';
function loadMkHist(){
  if(state.mkt.hist) return;
  state.mkt.hist = {};
  try{
    const h = JSON.parse(localStorage.getItem(MK_LS) || 'null');
    if(h && typeof h === 'object') state.mkt.hist = h;
  }catch(e){}
}
function saveMkHist(){
  try{
    const h = state.mkt.hist || {}, keys = Object.keys(h).sort();
    while(keys.length > 60) delete h[keys.shift()];
    localStorage.setItem(MK_LS, JSON.stringify(h));
  }catch(e){}
}
function mktRecord(){
  const m = state.mkt, ph = mktPhase();
  if(ph !== 'after' && ph !== 'closed' && ph !== 'pre') return;
  loadMkHist();
  const qsh = m.idx && m.idx.get(IDX_SH), qsz = m.idx && m.idx.get(IDX_SZ);
  const amt = (qsh && qsz && qsh.amount > 0) ? qsh.amount + qsz.amount : 0;
  const t = (qsh && qsh.time) || '';
  if(!amt || (+t.slice(0,2))*60 + (+t.slice(3,5)) < 900) return;   // 仅记录已完成的全天数据
  const sr = (m.daily && m.daily.sh) || [];
  const date = ph === 'after' ? dateStr(new Date()) : (sr.length ? sr[sr.length-1].date : '');
  if(!date || m.hist[date] === amt) return;
  m.hist[date] = amt;
  saveMkHist();
}
loadMkHist();

/* 板块资金流：行业/概念 × 净额/占比 四榜（东财 clist，f62 主力净额/元，f184 净占比/%） */
const FLOW_FIELDS = 'f12,f14,f62,f184';
const FLOW_FS = { ind:'m:90+t:2', con:'m:90+t:3' };
async function fetchFlowList(fs, fid){
  const arr = await emClist(fs, fid, 10, FLOW_FIELDS);
  return (arr || []).filter(x => x && x.f14 && isFinite(+x.f62)).slice(0, 6)
    .map(x => ({ name: String(x.f14), amt: +x.f62, pct: +x.f184 }));
}
async function mktFlow(){
  const m = state.mkt;
  const jobs = [];
  for(const kind of ['ind', 'con']) for(const sort of ['amt', 'pct'])
    jobs.push([kind, sort, fetchFlowList(FLOW_FS[kind], sort === 'pct' ? 'f184' : 'f62').catch(() => null)]);
  const res = await Promise.all(jobs.map(j => j[2]));
  res.forEach((list, i) => {
    if(!list || !list.length) return;
    const kind = jobs[i][0], sort = jobs[i][1];
    m.flow = m.flow || {};
    m.flow[kind] = m.flow[kind] || {};
    m.flow[kind][sort] = list;
  });
}
function fmtFlow(v){
  if(!isFinite(v) || v === 0) return '--';
  const a = Math.abs(v), s = v > 0 ? '+' : '-';
  return s + (a >= 1e8 ? (a/1e8).toFixed(1)+'亿' : a >= 1e4 ? Math.round(a/1e4)+'万' : Math.round(a));
}
function fmtPctFlow(v){
  if(!isFinite(v)) return '--';
  return (v > 0 ? '+' : '') + v.toFixed(1) + '%';
}
function renderFlowBar(){
  const m = state.mkt;
  const box = $('#flowChips');
  const kind = m.flowKind || 'ind', sort = m.flowSort || 'amt';
  document.querySelectorAll('#flowKind .fl-tab').forEach(b => b.classList.toggle('on', b.dataset.kind === kind));
  document.querySelectorAll('#flowSort .fl-tab').forEach(b => b.classList.toggle('on', b.dataset.sort === sort));
  const arr = m.flow && m.flow[kind] && m.flow[kind][sort];
  if(!arr || !arr.length){
    box.innerHTML = '<span class="fl-chip">资金流数据获取中…</span>';
    return;
  }
  const key = sort === 'pct' ? 'pct' : 'amt';
  const inflow = arr[0].amt >= 0;
  const list = inflow ? arr : arr.slice().sort((a, b) => a[key] - b[key]);
  $('#flowLabel').textContent = inflow ? '主力净流入' : '主力净流出';
  box.innerHTML = list.map((x, i) => '<span class="fl-chip ' + (x.amt >= 0 ? 'up' : 'down') + (i === 0 ? ' top' : '') + '"' +
    ' title="主力净额 ' + fmtFlow(x.amt) + ' · 净占比 ' + fmtPctFlow(x.pct) + '">' +
    x.name + ' ' + (sort === 'pct' ? fmtPctFlow(x.pct) : fmtFlow(x.amt)) + '</span>').join('');
}
$('#flowKind').addEventListener('click', e => {
  const b = e.target.closest('.fl-tab');
  if(!b || !b.dataset.kind || b.dataset.kind === state.mkt.flowKind) return;
  state.mkt.flowKind = b.dataset.kind;
  saveCfg();
  renderFlowBar();
});
$('#flowSort').addEventListener('click', e => {
  const b = e.target.closest('.fl-tab');
  if(!b || !b.dataset.sort || b.dataset.sort === state.mkt.flowSort) return;
  state.mkt.flowSort = b.dataset.sort;
  saveCfg();
  renderFlowBar();
});

async function mktTick(force){
  const m = state.mkt;
  if(m.loading) return;
  m.loading = true;
  try{
    const qs = await fetchQuotes(IDX_CODES);
    if(qs && qs.size){ m.idx = qs; m.idxAt = Date.now(); }
    await loadIdxDaily(!!force);
    mktRecord();
  }catch(e){}
  await mktFlow();
  m.loading = false;
  renderMktBar();
  renderFlowBar();
}

const MKT_GRADE = [
  { min: 25,   tag:'显著放量', cls:'big',    tip:'量能充沛，强势股与竞价信号可信度较高' },
  { min: 10,   tag:'放量',     cls:'mid',    tip:'量能温和放大，可积极参与主流强势股' },
  { min: -10,  tag:'量能平稳', cls:'norm',   tip:'量能与近期持平，按常规节奏操作' },
  { min: -25,  tag:'缩量',     cls:'shrink', tip:'量能萎缩，谨慎追高、控制仓位' },
  { min: -1e9, tag:'显著缩量', cls:'shrink', tip:'量能明显不足，谨防冲高回落，以观望为主' }
];

function mktGrade(ratio, refLabel, isEst){
  const g = MKT_GRADE.find(x => ratio >= x.min);
  const sign = ratio > 0 ? '+' : '';
  const tagEl = $('#mkTag');
  tagEl.className = 'mk-tag ' + g.cls;
  tagEl.textContent = (isEst ? '预计' : '') + g.tag + ' ' + sign + ratio.toFixed(1) + '%';
  $('#mkTip').textContent = refLabel + ' · ' + g.tip;
}

function renderMktBar(){
  const m = state.mkt;
  const put = (code, pxSel, pctSel) => {
    const q = m.idx && m.idx.get(code);
    const px = $(pxSel), pct = $(pctSel);
    if(!q){ px.textContent = '--'; px.className = 'mk-px'; pct.textContent = '--'; pct.className = 'mk-pct'; return; }
    const cls = signCls(q.changePct);
    px.textContent = fmt2(q.price); px.className = 'mk-px ' + cls;
    pct.textContent = fmtPct(q.changePct); pct.className = 'mk-pct ' + cls;
  };
  put(IDX_SH, '#mkShPx', '#mkShPct');
  put('sz399001', '#mkSzPx', '#mkSzPct');
  put('sz399006', '#mkCyPx', '#mkCyPct');

  const now = new Date(), ph = mktPhase(), today = dateStr(now);
  const nowMin = now.getHours()*60 + now.getMinutes();
  const daily = m.daily || {};
  const shRows = daily.sh || [], szRows = daily.sz || [];
  const hist = m.hist || {};
  const dSub = s => s ? s.slice(5) : '--';
  const hasToday = !!(shRows.length && shRows[shRows.length-1].date === today);
  const dayVol = off => {
    let sum = 0, date = '', n = 0;
    if(shRows.length >= off){ sum += shRows[shRows.length-off].vol; date = shRows[shRows.length-off].date; n++; }
    if(szRows.length >= off){ sum += szRows[szRows.length-off].vol; n++; }
    return n ? { vol: sum, date } : null;
  };
  const offLast = hasToday ? 2 : 1;   // 盘中K线可能已含今日，最近完整交易日偏移
  const curDate = shRows.length >= offLast ? shRows[shRows.length-offLast].date : '';
  const baseDate = shRows.length >= offLast+1 ? shRows[shRows.length-offLast-1].date : '';
  const yAmt = curDate ? (hist[curDate] || 0) : 0;        // 上一交易日全天成交额
  const baseAmt = baseDate ? (hist[baseDate] || 0) : 0;   // 再前一日全天成交额
  const qsh = m.idx && m.idx.get(IDX_SH), qsz = m.idx && m.idx.get(IDX_SZ);
  const rtAmt = (qsh && qsz && qsh.amount > 0) ? qsh.amount + qsz.amount : 0;
  const rtVol = (qsh ? qsh.volume : 0) + ((qsz && szRows.length) ? qsz.volume : 0);
  const qMin = qsh && qsh.time ? (+qsh.time.slice(0,2))*60 + (+qsh.time.slice(3,5)) : -1;
  const finalized = qMin >= 900;
  const stale = finalized && nowMin < 900;   // 未到15:00却拿到收盘数据 → 休市日残留

  const dts = Object.keys(hist).sort().reverse().slice(0, 5);
  $('#mkAmt').parentElement.title = dts.length
    ? (dts.length > 1 ? '近 ' + dts.length + ' 日' : '') + '两市总成交额：\n' + dts.map(d => d + '  ' + fmtBig(hist[d])).join('\n')
    : '两市总成交额 = 上证 + 深综指';

  // 盘中/盘后：实时成交额 + 按进度预估，与上一交易日全天金额对比
  if(!stale && (ph === 'open' || ph === 'after') && rtVol > 0){
    const isAfter = ph === 'after';
    const mi = minuteIndex(nowMin);
    if(isAfter || mi >= 15){
      if(rtAmt > 0){
        const est = isAfter ? rtAmt : rtAmt / (mi / 240);
        $('#mkAmt').textContent = fmtBig(rtAmt);
        $('#mkAmtSub').textContent = (isAfter ? '全天' : '预计全天 ' + fmtBig(est)) + (yAmt > 0 ? ' · 昨 ' + fmtBig(yAmt) : '');
        if(yAmt > 0){
          mktGrade((est / yAmt - 1) * 100, (isAfter ? '全天较 ' : '较 ') + dSub(curDate) + (isAfter ? ' 成交额' : ' 预估成交额'), !isAfter);
          return;
        }
      }
      const prev = dayVol(offLast);
      if(prev && prev.vol > 0){
        const cur = isAfter ? rtVol : rtVol / (mi / 240);
        mktGrade((cur / prev.vol - 1) * 100, (isAfter ? '全天较 ' : '较 ') + dSub(prev.date) + ' 量能', !isAfter);
      }
      return;
    }
    $('#mkAmt').textContent = rtAmt > 0 ? fmtBig(rtAmt) : '--';
    $('#mkAmtSub').textContent = '开盘初期';
    $('#mkTag').className = 'mk-tag norm';
    $('#mkTag').textContent = '量能监测中';
    $('#mkTip').textContent = '9:45 后给出全天量能预估';
    return;
  }
  // 非交易时段（含休市日残留数据）：展示最近完整交易日的全天成交额
  const curAmt = (curDate && hist[curDate]) || (finalized ? rtAmt : 0);
  if(curAmt > 0){
    $('#mkAmt').textContent = fmtBig(curAmt);
    $('#mkAmtSub').textContent = (ph === 'closed' ? '休市 · ' : '上一交易日 ') + dSub(curDate) + ' 全天';
    if(baseAmt > 0){
      mktGrade((curAmt / baseAmt - 1) * 100, dSub(curDate) + ' 较前日成交额', false);
    }else{
      const cv = dayVol(offLast), pv = dayVol(offLast + 1);
      if(cv && pv && pv.vol > 0){
        mktGrade((cv.vol / pv.vol - 1) * 100, dSub(cv.date) + ' 全天较前日', false);
      }else{
        $('#mkTag').className = 'mk-tag norm';
        $('#mkTag').textContent = '最近交易日 ' + fmtBig(curAmt);
        $('#mkTip').textContent = dSub(curDate) + ' 全天总成交额（对比数据积累中）';
      }
    }
  }else{
    $('#mkAmt').textContent = '--';
    $('#mkAmtSub').textContent = '';
    $('#mkTag').className = 'mk-tag norm';
    $('#mkTag').textContent = '量能获取中';
    $('#mkTip').textContent = curDate ? '成交额数据加载中，稍后自动重试…' : '日K与成交额数据加载中…';
  }
}
